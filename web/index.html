<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ComputerVision Demo</title>
  <style>canvas{max-width:100%;height:auto;} img{max-width:100%;}</style>
</head>
<body>
  <h1>CV Demo — Upload Image</h1>
  <input id="file" type="file" accept="image/*" />
  <button id="send">Send</button>
  <div id="out"></div>
  <canvas id="c" ></canvas>
  <script>
  const API_BASE = (location.hostname === '127.0.0.1' || location.hostname === 'localhost') ? 'http://127.0.0.1:8002' : '';
  const fileInput = document.getElementById('file');
  const sendBtn = document.getElementById('send');
  const out = document.getElementById('out');
  const canvas = document.getElementById('c');
  sendBtn.onclick = async () => {
    if (!fileInput.files.length) return alert('Choose file');
    const f = fileInput.files[0];
    const fd = new FormData(); fd.append('file', f);
    out.textContent = 'Uploading...';
    const res = await fetch(API_BASE + '/api/onnx_predict', {method:'POST', body:fd});
    const json = await res.json();
    if (json.error) { out.textContent = 'Error: '+json.error; return; }
    out.textContent = JSON.stringify(json.predictions, null, 2);
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0);
      json.predictions.forEach(p=>{
        const [x1,y1,x2,y2]=p.xyxy; ctx.strokeStyle='red'; ctx.lineWidth=3; ctx.strokeRect(x1,y1,x2-x1,y2-y1);
        ctx.fillStyle='red'; ctx.font='20px Arial'; ctx.fillText((p.class||'')+':'+(p.conf||'').toFixed(2), x1+5, y1-5);
      });
    };
    img.src = URL.createObjectURL(f);
  };
  </script>
</body>
</html>
